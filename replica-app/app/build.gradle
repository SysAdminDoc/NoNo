plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.ksp)
    alias(libs.plugins.kotlin.compose)
    alias(libs.plugins.kotlin.serialization)
}

/** Room's exported schemas. Read by the migration tests, so both ends must name the same place. */
def roomSchemas = file("$projectDir/schemas")

// Release signing credentials, never committed. See replica-app/README.md.
// Absent on a machine that only builds debug, which is why the config below is conditional and
// the verifyReleaseSigning task exists to refuse an unsigned release rather than ship one.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keystore.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}
def hasReleaseSigning = keystoreProperties.containsKey('storeFile') &&
    file(keystoreProperties['storeFile'] as String).exists()

android {
    namespace 'com.sysadmindoc.nono'
    compileSdk 37

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(keystoreProperties['storeFile'] as String)
                storePassword keystoreProperties['storePassword'] as String
                keyAlias keystoreProperties['keyAlias'] as String
                keyPassword keystoreProperties['keyPassword'] as String
                // v1 is omitted deliberately: minSdk is 24, so v2 is understood everywhere this
                // app runs, and a v1 signature would put the signer's name in the APK listing.
                enableV1Signing false
                enableV2Signing true
                enableV3Signing true
            }
        }
    }

    defaultConfig {
        applicationId 'com.sysadmindoc.nono'
        minSdk 24
        targetSdk 36
        versionCode 8
        versionName '1.4.0-reconstruction'

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        vectorDrawables.useSupportLibrary = true
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
            debuggable true
        }
        release {
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
        }
    }

    packaging {
        resources.excludes += '/META-INF/{AL2.0,LGPL2.1}'
    }

    sourceSets {
        // MigrationTestHelper reads the exported schemas from the test APK's assets. Without
        // this the migration tests fail at createDatabase with "Cannot find the schema file",
        // which is what kept them from ever passing on a device.
        //
        // builtBy is what makes the asset merge wait for the annotation processor. Adding the
        // directory alone leaves the producer unmodelled: on a clean tree the assets are gathered
        // before Room writes them, so the first run after a schema bump packages the previous
        // version and the migration test validates against a schema that is no longer the code's.
        androidTest.assets.srcDirs += roomSchemas
    }

    lint {
        abortOnError true
        checkDependencies true
        warningsAsErrors false
    }

}

ksp {
    // Passed as a provider rather than a bare string so the directory is declared as an output of
    // the KSP task. A plain `arg` is opaque to Gradle: the schema files are produced by a task
    // that never says it produces them, which is both an undeclared dependency for anything
    // reading them and invisible to up-to-date checking.
    arg(new RoomSchemaArgumentProvider(objects.directoryProperty().fileValue(roomSchemas)))
}

// AGP resolves `assets.srcDirs` to plain paths and drops any task dependency the file collection
// carried, so `builtBy` on the source set is silently ignored. Every androidTest task that reads
// the schema directory therefore has to say so itself: the asset merge, and lint's model writer,
// which walks the same source set. Without this the asset merge can run before the annotation
// processor - on a clean tree the first run after a schema bump packages the previous version, and
// the migration test then validates against a schema that is no longer the code's - and Gradle
// fails the lint model task outright for the undeclared dependency.
//
// Matched by name because that is the only handle AGP offers, and narrowly: naming every task with
// "androidTest" in it cycles, because KSP's own androidTest variant needs the generated
// BuildConfig that such a pattern also catches.
tasks.matching { it.name ==~ /((generate|merge)\w*AndroidTest(Assets|LintModel)|lintAnalyze\w*AndroidTest)/ }
    .configureEach { consumer ->
        consumer.dependsOn(tasks.matching { it.name ==~ /ksp\w*Kotlin/ })
    }

/** Declares Room's exported-schema directory as a real task output. */
class RoomSchemaArgumentProvider implements CommandLineArgumentProvider {

    @OutputDirectory
    final DirectoryProperty schemaDirectory

    RoomSchemaArgumentProvider(DirectoryProperty schemaDirectory) {
        this.schemaDirectory = schemaDirectory
    }

    @Override
    Iterable<String> asArguments() {
        ["room.schemaLocation=${schemaDirectory.get().asFile.absolutePath}".toString()]
    }
}

dependencies {
    implementation platform(libs.compose.bom)
    implementation libs.activity.compose
    implementation libs.compose.ui
    implementation libs.compose.ui.tooling.preview
    implementation libs.compose.foundation
    implementation libs.compose.material3
    implementation libs.material.icons
    implementation libs.lifecycle.viewmodel.compose
    implementation libs.lifecycle.runtime.compose
    implementation libs.datastore.preferences
    implementation libs.room.runtime
    implementation libs.room.ktx
    implementation libs.serialization.json
    ksp libs.room.compiler

    debugImplementation libs.compose.ui.tooling
    debugImplementation libs.compose.ui.test.manifest

    testImplementation libs.junit
    testImplementation libs.coroutines.test
    androidTestImplementation platform(libs.compose.bom)
    androidTestImplementation libs.androidx.test.junit
    androidTestImplementation libs.androidx.test.runner
    androidTestImplementation libs.espresso.accessibility
    androidTestImplementation libs.compose.ui.test.junit4
    androidTestImplementation libs.room.testing
}

/**
 * Refuses a release build that is not signed or is debuggable.
 *
 * The signing config is conditional, because a machine with no keystore must still be able to
 * build and test. Without this the release task would succeed quietly and produce an unsigned
 * artifact, which is how the previously distributed checksum ended up naming a debuggable APK.
 */
tasks.register('verifyReleaseSigning') {
    group = 'verification'
    description = 'Fails unless release signing credentials are configured.'
    doLast {
        if (!hasReleaseSigning) {
            throw new GradleException(
                'Release signing is not configured. Create replica-app/keystore.properties with ' +
                    'storeFile, storePassword, keyAlias and keyPassword. It is gitignored; see README.md.'
            )
        }
    }
}

/**
 * Guards the tasks that write the artifact, not the lifecycle aliases above them.
 *
 * dependsOn from assembleRelease imposes no ordering against packageRelease, so the unsigned APK
 * was fully written before the guard ran, and invoking packageRelease or bundleRelease directly
 * skipped the guard altogether. A doFirst on the producing task cannot be got round either way.
 */
// Named exactly, not matched by prefix: packageReleaseResources and lintVitalRelease are
// release-adjacent but write no distributable, and failing those would stop a machine with no
// credentials from linting.
def releaseArtifactTasks = ['packageRelease', 'packageReleaseBundle', 'signReleaseBundle']
// The reproducibility check compares two deliberately unsigned builds, so it needs a way past
// this. A named property makes that an explicit choice rather than something a stray -x achieves.
def allowUnsignedRelease = project.hasProperty('allowUnsignedRelease') &&
    project.property('allowUnsignedRelease').toString().toBoolean()
tasks.matching { it.name in releaseArtifactTasks }.configureEach {
    doFirst {
        if (!hasReleaseSigning && !allowUnsignedRelease) {
            throw new GradleException(
                'Release signing is not configured. Create replica-app/keystore.properties with ' +
                    'storeFile, storePassword, keyAlias and keyPassword. It is gitignored; see ' +
                    'README.md. To build an unsigned release on purpose, pass ' +
                    '-PallowUnsignedRelease=true.'
            )
        }
    }
}
