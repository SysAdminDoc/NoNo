plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.ksp)
    alias(libs.plugins.kotlin.compose)
    alias(libs.plugins.kotlin.serialization)
}

// Release signing credentials, never committed. See replica-app/README.md.
// Absent on a machine that only builds debug, which is why the config below is conditional and
// the verifyReleaseSigning task exists to refuse an unsigned release rather than ship one.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keystore.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}
def hasReleaseSigning = keystoreProperties.containsKey('storeFile') &&
    file(keystoreProperties['storeFile'] as String).exists()

android {
    namespace 'com.sysadmindoc.nono'
    compileSdk 37

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(keystoreProperties['storeFile'] as String)
                storePassword keystoreProperties['storePassword'] as String
                keyAlias keystoreProperties['keyAlias'] as String
                keyPassword keystoreProperties['keyPassword'] as String
                // v1 is omitted deliberately: minSdk is 24, so v2 is understood everywhere this
                // app runs, and a v1 signature would put the signer's name in the APK listing.
                enableV1Signing false
                enableV2Signing true
                enableV3Signing true
            }
        }
    }

    defaultConfig {
        applicationId 'com.sysadmindoc.nono'
        minSdk 24
        targetSdk 36
        versionCode 8
        versionName '1.4.0-reconstruction'

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        vectorDrawables.useSupportLibrary = true
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
            debuggable true
        }
        release {
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
        }
    }

    packaging {
        resources.excludes += '/META-INF/{AL2.0,LGPL2.1}'
    }

    sourceSets {
        // MigrationTestHelper reads the exported schemas from the test APK's assets. Without
        // this the migration tests fail at createDatabase with "Cannot find the schema file",
        // which is what kept them from ever passing on a device.
        androidTest.assets.srcDirs += files("$projectDir/schemas")
    }

    lint {
        abortOnError true
        checkDependencies true
        warningsAsErrors false
    }

}

ksp {
    arg('room.schemaLocation', "$projectDir/schemas")
}

dependencies {
    implementation platform(libs.compose.bom)
    implementation libs.activity.compose
    implementation libs.compose.ui
    implementation libs.compose.ui.tooling.preview
    implementation libs.compose.foundation
    implementation libs.compose.material3
    implementation libs.material.icons
    implementation libs.lifecycle.viewmodel.compose
    implementation libs.lifecycle.runtime.compose
    implementation libs.datastore.preferences
    implementation libs.room.runtime
    implementation libs.room.ktx
    implementation libs.serialization.json
    ksp libs.room.compiler

    debugImplementation libs.compose.ui.tooling
    debugImplementation libs.compose.ui.test.manifest

    testImplementation libs.junit
    testImplementation libs.coroutines.test
    androidTestImplementation platform(libs.compose.bom)
    androidTestImplementation libs.androidx.test.junit
    androidTestImplementation libs.androidx.test.runner
    androidTestImplementation libs.espresso.accessibility
    androidTestImplementation libs.compose.ui.test.junit4
    androidTestImplementation libs.room.testing
}

/**
 * Refuses a release build that is not signed or is debuggable.
 *
 * The signing config is conditional, because a machine with no keystore must still be able to
 * build and test. Without this the release task would succeed quietly and produce an unsigned
 * artifact, which is how the previously distributed checksum ended up naming a debuggable APK.
 */
tasks.register('verifyReleaseSigning') {
    group = 'verification'
    description = 'Fails unless release signing credentials are configured.'
    doLast {
        if (!hasReleaseSigning) {
            throw new GradleException(
                'Release signing is not configured. Create replica-app/keystore.properties with ' +
                    'storeFile, storePassword, keyAlias and keyPassword. It is gitignored; see README.md.'
            )
        }
    }
}

tasks.matching { it.name == 'assembleRelease' || it.name == 'bundleRelease' }.configureEach {
    dependsOn 'verifyReleaseSigning'
}
