org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.defaults.buildfeatures.resvalues=true

# The Gradle build cache is off while Kotlin 2.4.10 is in use. GHSA-r937-wjx7-w2jp affects the
# Kotlin Gradle Plugin's build-cache handling, and as of 2026-08-31 the first patched line is
# 2.4.20-Beta1, which is not a stable release. Nothing here needs a cache: every build runs on one
# machine. Lift this together with the version bump, not before.
org.gradle.caching=false
