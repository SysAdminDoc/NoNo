/** The first Kotlin line carrying the fix for GHSA-r937-wjx7-w2jp. */
ext.KOTLIN_ADVISORY_FLOOR = '2.4.20'

/** True while the declared Kotlin is older than the patched line and is not a prerelease of it. */
static boolean isBelowAdvisoryFloorFor(String version, String floor) {
    def parts = { String v -> v.split('-')[0].tokenize('.').collect { it.toInteger() } }
    def left = parts(version)
    def right = parts(floor)
    for (int i = 0; i < Math.max(left.size(), right.size()); i++) {
        int a = i < left.size() ? left[i] : 0
        int b = i < right.size() ? right[i] : 0
        if (a != b) return a < b
    }
    // Equal release numbers: a prerelease of the patched line is not the patched line.
    return version.contains('-')
}

boolean isBelowAdvisoryFloor(String version) {
    isBelowAdvisoryFloorFor(version, KOTLIN_ADVISORY_FLOOR)
}

tasks.register('verifyBuildPolicy') {
    group = 'verification'
    description = 'Checks repository, wrapper, catalog, and dependency-verification policy.'

    doLast {
        def settingsText = file('settings.gradle').getText('UTF-8')
        def wrapperText = file('gradle/wrapper/gradle-wrapper.properties').getText('UTF-8')
        def catalogText = file('gradle/libs.versions.toml').getText('UTF-8')
        def verificationText = file('gradle/verification-metadata.xml').getText('UTF-8')
        def daemonJvmFile = file('gradle/gradle-daemon-jvm.properties')
        def failures = []

        // Without this the daemon runs on whatever JAVA_HOME points at. The Android Studio JBR is
        // OpenJDK 25, which this Gradle cannot even compile a build script under, and reproducible
        // builds are established against an LTS OpenJDK.
        if (!daemonJvmFile.exists()) {
            failures << 'gradle/gradle-daemon-jvm.properties is missing; the daemon JVM must stay pinned'
        } else if (!(daemonJvmFile.getText('UTF-8') =~ /(?m)^toolchainVersion=21$/).find()) {
            failures << 'daemon JVM criteria must pin toolchainVersion=21'
        }

        if (!settingsText.contains('repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)')) {
            failures << 'dependency repositories must use FAIL_ON_PROJECT_REPOS'
        }
        def repositories = (settingsText =~ /(?m)^\s*(google|mavenCentral|gradlePluginPortal)\(\)\s*$/).collect { it[1] }
        if (repositories.toSet() != ['google', 'mavenCentral', 'gradlePluginPortal'] as Set) {
            failures << "unexpected repository policy: ${repositories}"
        }

        if (!(wrapperText =~ /(?m)^distributionUrl=https\\:\/\/services\.gradle\.org\/distributions\/gradle-9\.7\.1-bin\.zip$/).find()) {
            failures << 'Gradle wrapper must remain pinned to the checked-in 9.7.1 binary distribution'
        }
        if (!wrapperText.contains('validateDistributionUrl=true')) {
            failures << 'Gradle wrapper URL validation is disabled'
        }

        def dynamicVersion = (catalogText =~ /(?m)^\s*[A-Za-z0-9_.-]+\s*=\s*"[^"]*(SNAPSHOT|latest|\\+)[^"]*"/)
        if (dynamicVersion.find()) {
            failures << 'version catalog contains a dynamic or snapshot version'
        }

        if (!verificationText.contains('<verify-metadata>true</verify-metadata>')) {
            failures << 'Gradle dependency metadata verification is disabled'
        }
        if (!verificationText.contains('<verify-signatures>false</verify-signatures>')) {
            failures << 'owner-gated PGP signature policy changed; review it explicitly before enabling signatures'
        }
        def artifactCount = (verificationText =~ /<artifact\s+name=/).count
        def hashCount = (verificationText =~ /<sha256\s+value=/).count
        if (artifactCount == 0 || artifactCount != hashCount) {
            failures << "dependency verification hash coverage is incomplete (${hashCount}/${artifactCount})"
        }

        // GHSA-r937-wjx7-w2jp: the Kotlin Gradle Plugin's build-cache handling. As of 2026-08-31
        // the first patched line is 2.4.20-Beta1, so there is no stable version to move to and the
        // cache is off instead. When a patched stable Kotlin ships, raise KOTLIN_ADVISORY_FLOOR
        // with the version bump and this gate lets the cache back in on its own.
        def kotlinVersion = (catalogText =~ /(?m)^\s*kotlin\s*=\s*"([^"]+)"/).with { it.find() ? it.group(1) : null }
        if (kotlinVersion == null) {
            failures << 'the version catalog does not declare a Kotlin version'
        } else if (isBelowAdvisoryFloor(kotlinVersion)) {
            def propertiesText = file('gradle.properties').getText('UTF-8')
            if (!(propertiesText =~ /(?m)^org\.gradle\.caching=false$/).find()) {
                failures << "Kotlin ${kotlinVersion} is affected by GHSA-r937-wjx7-w2jp; org.gradle.caching=false must stay set"
            }
            if (!settingsText.contains('settings.buildCache.remote != null')) {
                failures << 'the settings guard rejecting a remote build cache has been removed'
            }
            if (gradle.startParameter.buildCacheEnabled) {
                failures << 'this build was started with the build cache enabled; it stays off until Kotlin is patched'
            }
        }

        // Every schema version has to be on disk, not just the newest. MigrationTestHelper builds
        // an old database from its exported file, so a missing one turns into an instrumented test
        // failing on a device, which is the slowest possible place to find out. One went missing
        // exactly that way on 2026-08-31.
        def schemaDir = file('app/schemas/com.sysadmindoc.nono.data.SignalDatabase')
        def databaseSource = file('app/src/main/java/com/sysadmindoc/nono/data/SignalDatabase.kt').getText('UTF-8')
        def declaredVersion = (databaseSource =~ /version\s*=\s*(\d+),\s*exportSchema/).with {
            it.find() ? it.group(1).toInteger() : null
        }
        if (declaredVersion == null) {
            failures << 'the database version could not be read from SignalDatabase.kt'
        } else {
            def missingSchemas = (1..declaredVersion).findAll { !new File(schemaDir, "${it}.json").exists() }
            if (!missingSchemas.isEmpty()) {
                failures << "exported Room schemas are missing: ${missingSchemas.collect { it + '.json' }.join(', ')}"
            }
        }

        if (!failures.isEmpty()) {
            throw new GradleException('Build policy failed:\n - ' + failures.join('\n - '))
        }
        println "Build policy OK: kotlin=${kotlinVersion} buildCache=${isBelowAdvisoryFloor(kotlinVersion) ? 'off (GHSA-r937-wjx7-w2jp)' : 'permitted'} schemas=1..${declaredVersion} repositories=${repositories.unique().join(',')} wrapper=9.7.1 daemonJvm=21 verifiedArtifacts=${hashCount} advisoryGate=CI"
    }
}
